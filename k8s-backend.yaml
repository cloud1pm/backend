apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: your-docker-repo/cloud1pm-backend:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "backend"
            # [수정] Service 포트인 80으로 변경 (또는 포트 생략)
            - name: AI_SERVICE_URL
              value: "http://ai-analysis-service"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/cloud1pm?serverTimezone=UTC&characterEncoding=UTF-8"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            # [추가] JWT Secret을 환경변수로 주입 (k8s secret 생성 필요)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets  # 기존 api-secrets에 jwt-secret 키를 추가했다고 가정
                  key: jwt-secret
            # [추가] CORS 허용 도메인 설정 (Ingress 주소 등)
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,http://your-ingress-domain.com"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080