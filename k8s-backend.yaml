apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: your-docker-repo/cloud1pm-backend:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "backend"
            - name: AI_SERVICE_URL
              value: "http://ai-analysis-service"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/cloud1pm?serverTimezone=UTC&characterEncoding=UTF-8"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080