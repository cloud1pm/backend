apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analysis-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-analysis
  template:
    metadata:
      labels:
        app: ai-analysis
    spec:
      containers:
        - name: ai-analysis
          image: your-docker-repo/cloud1pm-backend:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "ai"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: gemini-key
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/cloud1pm?serverTimezone=UTC&characterEncoding=UTF-8"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "500m"
            limits:
              cpu: "1000m"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analysis-service
spec:
  type: ClusterIP
  selector:
    app: ai-analysis
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP